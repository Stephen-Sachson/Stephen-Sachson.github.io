<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Snake</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="arcade-shell" aria-label="Snake game">
      <section class="cabinet">
        <div class="top-bar">
          <div>
            <p class="eyebrow">Old-School</p>
            <h1>Snake</h1>
          </div>
          <div class="scoreboard" aria-live="polite">
            <span>Score <strong id="score">0</strong></span>
            <span>Best <strong id="best">0</strong></span>
          </div>
        </div>

        <div class="screen-wrap">
          <canvas id="game" width="600" height="600" aria-label="Snake play field"></canvas>
          <div id="overlay" class="overlay">
            <strong id="overlay-title">Snake</strong>
            <span id="overlay-copy">Use WASD or the D-pad to start</span>
          </div>
        </div>

        <div class="controls">
          <button id="restart" type="button">Restart</button>
          <button id="pause" type="button">Pause</button>
          <div class="keys" aria-label="Keyboard controls">
            <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
          </div>
        </div>

        <div class="touch-pad" aria-label="Touch controls">
          <button class="touch-button touch-up" type="button" data-direction="up" aria-label="Move up">&#9650;</button>
          <button class="touch-button touch-left" type="button" data-direction="left" aria-label="Move left">&#9664;</button>
          <button class="touch-button touch-right" type="button" data-direction="right" aria-label="Move right">&#9654;</button>
          <button class="touch-button touch-down" type="button" data-direction="down" aria-label="Move down">&#9660;</button>
        </div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
